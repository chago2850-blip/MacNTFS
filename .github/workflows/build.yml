# Compila los DMG para Apple Silicon e Intel en las Mac de GitHub (opcional).
# Publica una versión al subir una etiqueta: git tag v1.0.0 && git push --tags
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  MACNTFS_VERSION: "1.0.0"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          brew install autoconf automake libtool pkg-config create-dmg
          brew install --cask macfuse

      - name: Compilar
        env:
          MACNTFS_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export MACNTFS_VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$MACNTFS_VERSION" >> "$GITHUB_ENV"
          export MACNTFS_BUILD="$GITHUB_RUN_NUMBER"
          ./build.sh arm64 x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: MacNTFS-dmg
          path: dist/*.dmg

      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: MacNTFS ${{ env.VERSION }}
          files: dist/*.dmg
          make_latest: true
          body: |
            ## MacNTFS ${{ env.VERSION }}
            Lectura y escritura de discos NTFS en macOS. Libre y de código abierto.

            **Descarga el DMG de tu Mac:**
            - `MacNTFS-${{ env.VERSION }}-AppleSilicon.dmg` → Mac con chip M1, M2, M3, M4…
            - `MacNTFS-${{ env.VERSION }}-Intel.dmg` → Mac con procesador Intel

            **Primeros pasos:** arrastra MacNTFS a Aplicaciones, ábrelo (si macOS lo bloquea: Ajustes del Sistema → Privacidad y seguridad → Abrir igualmente), instala FUSE-T y pulsa *Instalar componentes*.
            Requiere macOS 13 Ventura o posterior.
