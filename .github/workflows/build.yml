# Compila los DMG para Apple Silicon e Intel en las Mac de GitHub (opcional).
# Publica una versión al subir una etiqueta: git tag v1.0.0 && git push --tags
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          brew install autoconf automake libtool pkg-config create-dmg
          brew install --cask macfuse

      - name: Compilar
        env:
          MACNTFS_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export MACNTFS_VERSION="${GITHUB_REF_NAME#v}"; fi
          export MACNTFS_BUILD="$GITHUB_RUN_NUMBER"
          ./build.sh arm64 x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: MacNTFS-dmg
          path: dist/*.dmg

      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
