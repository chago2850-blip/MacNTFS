<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A6B"/>
      <stop offset="0.55" stop-color="#101A47"/>
      <stop offset="1" stop-color="#070C26"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.18" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT" cx="0.92" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E7ECF5"/>
      <stop offset="1" stop-color="#B9C3D6"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1638"/>
      <stop offset="1" stop-color="#18245A"/>
    </linearGradient>
    <linearGradient id="nStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.12" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="26"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="led" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- tile -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glowV)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glowT)"/>
    <!-- subtle data grid -->
    <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
      <path d="M100 236H924M100 372H924M100 508H924M100 644H924M100 780H924"/>
      <path d="M236 100V924M372 100V924M508 100V924M644 100V924M780 100V924"/>
    </g>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#rim)"/>
  </g>

  <!-- drive -->
  <g filter="url(#shadow)">
    <rect x="212" y="292" width="600" height="452" rx="80" fill="url(#body)"/>
  </g>
  <rect x="214" y="294" width="596" height="448" rx="78" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.9"/>
  <!-- inset face -->
  <rect x="252" y="332" width="520" height="320" rx="48" fill="url(#face)"/>
  <rect x="252" y="332" width="520" height="320" rx="48" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="4"/>

  <!-- N monogram as a data path -->
  <g filter="url(#neon)">
    <path d="M402 578 V406 L622 578 V406" fill="none" stroke="url(#nStroke)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M402 578 V406 L622 578 V406" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(-6 -6)"/>

  <!-- bottom details: vents and activity LED -->
  <g fill="#8A97B2">
    <rect x="276" y="688" width="70" height="12" rx="6"/>
    <rect x="360" y="688" width="70" height="12" rx="6"/>
    <rect x="444" y="688" width="70" height="12" rx="6"/>
  </g>
  <circle cx="738" cy="694" r="13" fill="#34D399" filter="url(#led)"/>
  <circle cx="734" cy="690" r="4" fill="#ECFDF5"/>
</svg>
